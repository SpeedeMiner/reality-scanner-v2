name: Build Reality Scanner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Build Windows binary
      run: |
        go mod init reality-scanner
        
        # Скачиваем основные зависимости явно (для надежности перед tidy)
        github.com/refraction-networking/utls
        github.com/miekg/dns
        golang.org/x/net/http2
        golang.org/x/net/publicsuffix
        golang.org/x/sync/singleflight
        go mod tidy
        
        # Сборка только для Windows. Флаги -s -w уменьшают размер exe файла.
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o reality-scanner.exe
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: reality-scanner-windows
        path: reality-scanner.exe
